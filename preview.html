/* ============================================================
   TOKENS
   A single committed visual world: night showroom.
   Chrome is the accent *material*, not a hue.
   ============================================================ */
:root {
  --ground:        #08090c;
  --ground-2:      #0b0d11;
  --surface:       rgba(255, 255, 255, 0.035);
  --surface-hi:    rgba(255, 255, 255, 0.055);
  --line:          rgba(255, 255, 255, 0.09);
  --line-hi:       rgba(255, 255, 255, 0.18);

  --text:          #f0f2f5;
  --text-soft:     #b9c0c9;
  --text-muted:    #868e9b;

  --steel:         #7e97aa;
  --chrome-1:      #e9edf1;
  --chrome-2:      #97a3b0;

  --chrome: linear-gradient(100deg,
      #6e7a87 0%, #b9c3cd 18%, #ffffff 32%,
      #cdd5dd 46%, #7f8a96 64%, #aeb8c2 82%, #6e7a87 100%);
  --hairline: linear-gradient(90deg,
      transparent, rgba(255,255,255,.28) 22%, rgba(255,255,255,.62) 50%,
      rgba(255,255,255,.28) 78%, transparent);

  --font-latin: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-arabic: 'Cairo', system-ui, sans-serif;
  --font: var(--font-latin);

  --step--1: clamp(.78rem, .74rem + .18vw, .875rem);
  --step-0:  clamp(1rem, .96rem + .2vw, 1.075rem);
  --step-1:  clamp(1.12rem, 1.03rem + .42vw, 1.35rem);
  --step-2:  clamp(1.45rem, 1.24rem + 1.05vw, 2.1rem);
  --step-3:  clamp(1.9rem, 1.5rem + 2vw, 3.1rem);
  --step-4:  clamp(2.6rem, 1.6rem + 5vw, 5.6rem);
  --step-5:  clamp(3.1rem, 1.5rem + 8vw, 8.5rem);

  --gutter: clamp(1.25rem, 4vw, 3rem);
  --container: 1220px;
  --nav-h: 74px;
  --section-y: clamp(4.5rem, 9vw, 8.5rem);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--step-0);
  font-weight: 300;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

html[lang="ar"] body { --font: var(--font-arabic); line-height: 1.9; font-weight: 400; }

::selection { background: rgba(190, 202, 214, .28); color: #fff; }

h1, h2, h3, h4 { margin: 0; font-weight: 800; line-height: 1.05; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--steel);
  outline-offset: 3px;
  border-radius: 2px;
}

/* ---------- shared type roles ---------- */
.eyebrow {
  font-size: var(--step--1);
  font-weight: 600;
  font-stretch: 88%;
  text-transform: uppercase;
  letter-spacing: .3em;
  color: var(--text-muted);
  margin: 0;
}
html[lang="ar"] .eyebrow { letter-spacing: 0; text-transform: none; font-weight: 700; }

.display {
  font-size: var(--step-5);
  font-weight: 900;
  font-stretch: 122%;
  letter-spacing: -.03em;
  line-height: .92;
}
html[lang="ar"] .display { font-stretch: normal; letter-spacing: 0; line-height: 1.18; }

.h2 {
  font-size: var(--step-3);

            a.stats.map(function (s) {
              return '<div class="stat-cell"><div class="stat-v">' + s.v + '</div><div class="stat-l">' + s.l + '</div></div>';
            }).join("") +
          '</div>' +
        '</div></section>';
    },

    services: function (d) {
      var s = d.services;
      return '' +
        '<section class="section"><div class="container">' +
          '<div class="section-head">' +
            '<p class="eyebrow">' + s.eyebrow + '</p>' +
            '<h1 class="h2" style="font-size:var(--step-4)">' + s.title + '</h1>' +
            '<p class="lead">' + s.lead + '</p>' +
          '</div>' +
          '<div class="grid-3">' +
            SERVICES.map(function (sv) {
              var item = s.items[sv.id];
              return '<article class="card"><div class="card-body">' +
                '<div class="icon-frame"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[sv.icon] + '</svg></div>' +
                '<h3 class="card-title">' + item.name + '</h3>' +
                '<p class="card-desc">' + item.desc + '</p>' +
                '<ul class="feature-list">' + item.points.map(function (p) { return '<li>' + p + '</li>'; }).join("") + '</ul>' +
                '<a class="btn card-cta" href="' + PATHS.services + '">' + s.cta + '</a>' +
              '</div></article>';
            }).join("") +
          '</div>' +
        '</div></section>' +

        '<section class="band"><div class="container band-inner">' +
          '<h2 class="h2">' + s.bandTitle + '</h2>' +
          '<p class="lead">' + s.bandLead + '</p>' +
          '<a class="btn btn-solid" href="' + PATHS.home + '">' + s.bandCta + '</a>' +
        '</div></section>';
    }
  };

  /* =========================================================
     SHELL — nav, footer, router, language
     ========================================================= */
  var el = {
    view: document.querySelector("[data-view]"),
    linksDesktop: document.querySelector("[data-links-desktop]"),
    linksMobile: document.querySelector("[data-links-mobile]"),
    langBtn: document.querySelector("[data-lang-toggle]"),
    langLabel: document.querySelector("[data-lang-label]"),
    navCta: document.querySelector("[data-nav-cta]"),
    brandSub: document.querySelector("[data-brand-sub]"),
    burger: document.querySelector("[data-burger]"),
    drawer: document.querySelector("[data-drawer]"),
    footerTop: document.querySelector("[data-footer-top]"),
    footerBottom: document.querySelector("[data-footer-bottom]")
  };

  var lang = "en";
  try {
    var saved = window.localStorage.getItem("mbly-lang");
    if (saved === "ar" || saved === "en") { lang = saved; }
  } catch (e) { /* storage unavailable — default to English */ }

  function currentRoute() {
    var key = (location.hash || "#/").replace("#/", "");
    return ROUTES.indexOf(key) > -1 ? key : "home";
  }

  function navMarkup(d, route) {
    return ROUTES.map(function (r) {
      var active = r === route ? ' aria-current="page"' : "";
      return '<a class="nav-link" href="' + PATHS[r] + '"' + active + '>' + d.nav[r] + '</a>';
    }).join("");
  }

  function renderFooter(d) {
    el.footerTop.innerHTML = '' +
      '<div>' +
        '<div class="brand" style="pointer-events:none">' +
          '<svg class="brand-star" viewBox="0 0 48 48" fill="none" aria-hidden="true">' +
            '<circle cx="24" cy="24" r="21" stroke-width="1.6" opacity=".85"/>' +
            '<path d="M24 24V6M24 24 8.4 33M24 24l15.6 9" stroke-width="1.6" stroke-linecap="round"/>' +
          '</svg>' +
          '<span class="brand-text"><span class="brand-name">MERCEDES-BENZ</span>' +
          '<span class="brand-sub">' + d.brandSub + '</span></span>' +
        '</div>' +
        '<p class="footer-blurb">' + d.footer.blurb + '</p>' +
      '</div>' +
      d.footer.cols.map(function (c) {
        var body = c.links
          ? c.links.map(function (l) { return '<li><a href="' + l[1] + '">' + l[0] + '</a></li>'; }).join("")
          : c.items.map(function (t) { return '<li>' + t + '</li>'; }).join("");
        return '<div class="footer-col"><h4>' + c.h + '</h4><ul>' + body + '</ul></div>';
      }).join("");

    el.footerBottom.innerHTML =
      '<span>' + d.footer.rights + '</span><span>' + d.footer.note + '</span>';
  }

  function closeDrawer() {
    el.drawer.classList.remove("open");
    el.burger.setAttribute("aria-expanded", "false");
  }

  function render(scrollTop) {
    var d = COPY[lang];
    var route = currentRoute();

    document.documentElement.lang = lang;
    document.documentElement.dir = d.dir;

    el.langLabel.textContent = d.langLabel;
    el.langBtn.setAttribute("aria-label", lang === "en" ? "التبديل إلى العربية" : "Switch to English");
    el.navCta.textContent = d.navCta;
    el.brandSub.textContent = d.brandSub;

    el.linksDesktop.innerHTML = navMarkup(d, route);
    el.linksMobile.innerHTML = navMarkup(d, route) +
      '<a class="btn" href="' + PATHS.services + '">' + d.navCta + '</a>';

    el.view.innerHTML = '<div class="page">' + PAGES[route](d) + '</div>';
    renderFooter(d);
    closeDrawer();

    if (scrollTop) { window.scrollTo({ top: 0, behavior: "auto" }); }
  }

  el.langBtn.addEventListener("click", function () {
    lang = lang === "en" ? "ar" : "en";
    try { window.localStorage.setItem("mbly-lang", lang); } catch (e) { /* ignore */ }
    render(false);
  });

  el.burger.addEventListener("click", function () {
    var open = el.drawer.classList.toggle("open");
    el.burger.setAttribute("aria-expanded", String(open));
  });

  el.drawer.addEventListener("click", function (e) {
    if (e.target.closest("a")) { closeDrawer(); }
  });

  window.addEventListener("hashchange", function () { render(true); });

  render(false);
})();
</script>
